<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 380" width="100%" height="100%">
  <rect width="900" height="380" rx="16" fill="#0f172a" stroke="#334155" stroke-width="1.5" />

  <!-- Android Studio IDE Box -->
  <g transform="translate(50, 45)">
    <rect width="330" height="290" rx="14" fill="#1e293b" stroke="#38bdf8" stroke-width="2" />
    <rect width="330" height="42" rx="14" fill="#334155" />
    <text x="20" y="28" font-family="'Space Grotesk', sans-serif" font-size="15" font-weight="700" fill="#38bdf8">Android Studio (Gemini Agent)</text>
    
    <g transform="translate(20, 60)">
      <rect width="290" height="55" rx="8" fill="#0f172a" stroke="#475569" stroke-width="1" />
      <text x="15" y="24" font-family="'JetBrains Mono', monospace" font-size="12" fill="#c084fc">MCP Client Manager</text>
      <text x="15" y="44" font-family="'JetBrains Mono', monospace" font-size="10" fill="#94a3b8">Settings &gt; Tools &gt; Gemini &gt; MCP</text>
    </g>

    <g transform="translate(20, 130)">
      <rect width="290" height="135" rx="8" fill="#0f172a" stroke="#475569" stroke-width="1" />
      <text x="15" y="24" font-family="'JetBrains Mono', monospace" font-size="11" fill="#38bdf8">.gemini/mcp.json</text>
      <text x="15" y="48" font-family="'JetBrains Mono', monospace" font-size="10" fill="#94a3b8">"github": {</text>
      <text x="30" y="68" font-family="'JetBrains Mono', monospace" font-size="10" fill="#94a3b8">  "type": "http",</text>
      <text x="30" y="88" font-family="'JetBrains Mono', monospace" font-size="10" fill="#94a3b8">  "url": "https://api.githubcopilot.com/mcp/"</text>
      <text x="15" y="108" font-family="'JetBrains Mono', monospace" font-size="10" fill="#94a3b8">}</text>
    </g>
  </g>

  <!-- Protocol Channel -->
  <g transform="translate(395, 155)">
    <rect width="110" height="55" rx="8" fill="#1e1b4b" stroke="#818cf8" stroke-width="2" />
    <text x="55" y="26" font-family="'Space Grotesk', sans-serif" font-size="12" font-weight="700" text-anchor="middle" fill="#f8fafc">HTTP / SSE</text>
    <text x="55" y="44" font-family="'JetBrains Mono', monospace" font-size="10" text-anchor="middle" fill="#818cf8">Streamable MCP</text>
  </g>

  <!-- Official GitHub Hosted MCP Server Box -->
  <g transform="translate(520, 45)">
    <rect width="330" height="290" rx="14" fill="#1e1b4b" stroke="#f8fafc" stroke-width="2" />
    <rect width="330" height="42" rx="14" fill="#24292f" />
    <text x="20" y="28" font-family="'Space Grotesk', sans-serif" font-size="14" font-weight="700" fill="#f8fafc">Hosted GitHub MCP Server</text>

    <!-- Tool 1 -->
    <g transform="translate(20, 60)">
      <rect width="290" height="60" rx="8" fill="#0f172a" stroke="#475569" stroke-width="1" />
      <text x="15" y="24" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="600" fill="#38bdf8">search_repositories &amp; issues</text>
      <text x="15" y="44" font-family="'JetBrains Mono', monospace" font-size="10" fill="#94a3b8">Queries upstream open issues &amp; PRDs</text>
    </g>

    <!-- Tool 2 -->
    <g transform="translate(20, 130)">
      <rect width="290" height="60" rx="8" fill="#0f172a" stroke="#475569" stroke-width="1" />
      <text x="15" y="24" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="600" fill="#38bdf8">get_release_by_tag</text>
      <text x="15" y="44" font-family="'JetBrains Mono', monospace" font-size="10" fill="#94a3b8">Inspects breaking changes &amp; release notes</text>
    </g>

    <!-- Tool 3 -->
    <g transform="translate(20, 200)">
      <rect width="290" height="60" rx="8" fill="#0f172a" stroke="#475569" stroke-width="1" />
      <text x="15" y="24" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="600" fill="#38bdf8">https://api.githubcopilot.com/mcp/</text>
      <text x="15" y="44" font-family="'JetBrains Mono', monospace" font-size="10" fill="#94a3b8">Official zero-install remote MCP endpoint</text>
    </g>
  </g>
</svg>
