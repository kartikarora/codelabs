      <text x="12" y="132" font-family="'JetBrains Mono', monospace" font-size="10" fill="#7ee787">+ val providers = movie.regionalProviders[region]</text>
      <text x="12" y="150" font-family="'JetBrains Mono', monospace" font-size="10" fill="#7ee787">+     ?: emptyList()</text>
      <text x="12" y="168" font-family="'JetBrains Mono', monospace" font-size="10" fill="#7ee787">+ if (providers.isEmpty()) return</text>

      <!-- Apply One-Click Patch -->
      <rect x="0" y="200" width="343" height="36" rx="6" fill="#58a6ff" />
      <text x="171" y="223" font-family="'Space Grotesk', sans-serif" font-size="12" font-weight="700" fill="#0d1117" text-anchor="middle">Apply Fix to MovieDetailViewModel.kt</text>
