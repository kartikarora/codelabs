<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 580" width="960" height="580">
  <rect width="960" height="580" rx="12" fill="#0d1117" stroke="#30363d" stroke-width="1.5" />

  <!-- Dialog Titlebar -->
  <rect width="960" height="40" rx="12" fill="#161b22" />
  <path d="M0 28 L0 40 L960 40 L960 28 Z" fill="#161b22" />
  <circle cx="20" cy="20" r="5" fill="#f85149" />
  <circle cx="36" cy="20" r="5" fill="#d29922" />
  <circle cx="52" cy="20" r="5" fill="#2ea043" />
  <text x="480" y="25" font-family="'Space Grotesk', sans-serif" font-size="13" font-weight="600" fill="#e6edf3" text-anchor="middle">Settings — Tools &gt; AI &gt; Agent permissions</text>
  <line x1="0" y1="40" x2="960" y2="40" stroke="#30363d" stroke-width="1" />

  <!-- Left Sidebar (Categories) -->
  <g transform="translate(0, 40)">
    <rect width="240" height="490" fill="#161b22" />
    <line x1="240" y1="0" x2="240" y2="490" stroke="#30363d" stroke-width="1" />

    <!-- Search box -->
    <rect x="16" y="16" width="208" height="32" rx="6" fill="#0d1117" stroke="#30363d" stroke-width="1" />
    <text x="30" y="37" font-family="'Space Grotesk', sans-serif" font-size="12" fill="#8b949e">Search settings...</text>

    <!-- Sidebar Items -->
    <text x="24" y="80" font-family="'Space Grotesk', sans-serif" font-size="12" fill="#8b949e">Appearance &amp; Behavior</text>
    <text x="24" y="112" font-family="'Space Grotesk', sans-serif" font-size="12" fill="#8b949e">Keymap</text>
    <text x="24" y="144" font-family="'Space Grotesk', sans-serif" font-size="12" fill="#8b949e">Build, Execution, Deployment</text>
    <text x="24" y="176" font-family="'Space Grotesk', sans-serif" font-size="12" fill="#8b949e">Languages &amp; Frameworks</text>
    
    <!-- Active Category -->
    <rect x="12" y="196" width="216" height="32" rx="6" fill="#21262d" />
    <text x="24" y="217" font-family="'Space Grotesk', sans-serif" font-size="12" font-weight="600" fill="#58a6ff">Tools &gt; AI &gt; Agent permissions</text>

    <text x="24" y="256" font-family="'Space Grotesk', sans-serif" font-size="12" fill="#8b949e">Studio Labs</text>
    <text x="24" y="288" font-family="'Space Grotesk', sans-serif" font-size="12" fill="#8b949e">Plugins</text>
    <text x="24" y="320" font-family="'Space Grotesk', sans-serif" font-size="12" fill="#8b949e">Version Control</text>
  </g>

  <!-- Main Content Area -->
  <g transform="translate(260, 56)">
    <!-- Header -->
    <text x="0" y="20" font-family="'Space Grotesk', sans-serif" font-size="18" font-weight="700" fill="#e6edf3">File Permissions</text>
    <text x="0" y="40" font-family="'Space Grotesk', sans-serif" font-size="12" fill="#8b949e">Set file permissions for agents and tools used by the agent.</text>

    <!-- Permissions List -->
    <!-- Item 1: Read files in the project -->
    <g transform="translate(0, 58)">
      <circle cx="10" cy="18" r="8" fill="none" stroke="#58a6ff" stroke-width="1.8" />
      <circle cx="10" cy="18" r="3" fill="#58a6ff" />
      <text x="32" y="23" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="500" fill="#e6edf3">Read files in the project</text>
      <!-- Dropdown -->
      <rect x="490" y="3" width="170" height="30" rx="5" fill="#21262d" stroke="#30363d" stroke-width="1" />
      <text x="502" y="23" font-family="'Space Grotesk', sans-serif" font-size="12" font-weight="600" fill="#3fb950">Always allow</text>
      <path d="M642 16 L648 22 L654 16" fill="none" stroke="#8b949e" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
    </g>

    <!-- Item 2: Write source files in the project -->
    <g transform="translate(0, 102)">
      <path d="M6 22 L14 14 L18 18 L10 26 Z M18 18 L19 15 L17 13 L14 14 Z" fill="#58a6ff" />
      <text x="32" y="23" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="500" fill="#e6edf3">Write source files in the project</text>
      <!-- Dropdown -->
      <rect x="490" y="3" width="170" height="30" rx="5" fill="#21262d" stroke="#30363d" stroke-width="1" />
      <text x="502" y="23" font-family="'Space Grotesk', sans-serif" font-size="12" font-weight="600" fill="#3fb950">Always allow</text>
      <path d="M642 16 L648 22 L654 16" fill="none" stroke="#8b949e" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
    </g>

    <!-- Item 3: Write executable files in the project -->
    <g transform="translate(0, 146)">
      <path d="M6 22 L14 14 L18 18 L10 26 Z M18 18 L19 15 L17 13 L14 14 Z" fill="#58a6ff" />
      <text x="32" y="23" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="500" fill="#e6edf3">Write executable files in the project</text>
      <!-- Dropdown -->
      <rect x="490" y="3" width="170" height="30" rx="5" fill="#21262d" stroke="#30363d" stroke-width="1" />
      <text x="502" y="23" font-family="'Space Grotesk', sans-serif" font-size="12" font-weight="500" fill="#d29922">Ask every time</text>
      <path d="M642 16 L648 22 L654 16" fill="none" stroke="#8b949e" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
    </g>

    <!-- Item 4: Delete or rename files in the project -->
    <g transform="translate(0, 190)">
      <path d="M6 14 H14 M7 14 V24 H13 V14 M9 11 H11" fill="none" stroke="#f85149" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" />
      <text x="32" y="23" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="500" fill="#e6edf3">Delete or rename files in the project</text>
      <!-- Dropdown -->
      <rect x="490" y="3" width="170" height="30" rx="5" fill="#21262d" stroke="#30363d" stroke-width="1" />
      <text x="502" y="23" font-family="'Space Grotesk', sans-serif" font-size="12" font-weight="600" fill="#3fb950">Always allow</text>
      <path d="M642 16 L648 22 L654 16" fill="none" stroke="#8b949e" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
    </g>

    <!-- Item 5: Access gitignored files -->
    <g transform="translate(0, 234)">
      <rect x="6" y="14" width="8" height="8" rx="1.5" transform="rotate(45 10 18)" fill="#8b949e" />
      <text x="32" y="23" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="500" fill="#e6edf3">Access gitignored files</text>
      <!-- Dropdown -->
      <rect x="490" y="3" width="170" height="30" rx="5" fill="#21262d" stroke="#30363d" stroke-width="1" />
      <text x="502" y="23" font-family="'Space Grotesk', sans-serif" font-size="12" font-weight="500" fill="#d29922">Ask every time</text>
      <path d="M642 16 L648 22 L654 16" fill="none" stroke="#8b949e" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
    </g>

    <!-- Item 6: Read files outside the project -->
    <g transform="translate(0, 278)">
      <circle cx="10" cy="18" r="8" fill="none" stroke="#58a6ff" stroke-width="1.8" />
      <circle cx="10" cy="18" r="3" fill="#58a6ff" />
      <text x="32" y="23" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="500" fill="#e6edf3">Read files outside the project</text>
      <!-- Dropdown -->
      <rect x="490" y="3" width="170" height="30" rx="5" fill="#21262d" stroke="#30363d" stroke-width="1" />
      <text x="502" y="23" font-family="'Space Grotesk', sans-serif" font-size="12" font-weight="500" fill="#d29922">Ask every time</text>
      <path d="M642 16 L648 22 L654 16" fill="none" stroke="#8b949e" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
      
      <!-- Sub-options -->
      <text x="48" y="44" font-family="'JetBrains Mono', monospace" font-size="11" fill="#8b949e">&gt; Always allowed files and folders (none)</text>
      <text x="48" y="60" font-family="'JetBrains Mono', monospace" font-size="11" fill="#8b949e">&gt; Blocked folders (none)</text>
    </g>

    <!-- Item 7: Write source files outside the project -->
    <g transform="translate(0, 350)">
      <path d="M6 22 L14 14 L18 18 L10 26 Z M18 18 L19 15 L17 13 L14 14 Z" fill="#58a6ff" />
      <text x="32" y="23" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="500" fill="#e6edf3">Write source files outside the project</text>
      <!-- Dropdown -->
      <rect x="490" y="3" width="170" height="30" rx="5" fill="#21262d" stroke="#30363d" stroke-width="1" />
      <text x="502" y="23" font-family="'Space Grotesk', sans-serif" font-size="12" font-weight="500" fill="#d29922">Ask every time</text>
      <path d="M642 16 L648 22 L654 16" fill="none" stroke="#8b949e" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
    </g>
  </g>

  <!-- Bottom Dialog Footer -->
  <g transform="translate(0, 530)">
    <line x1="0" y1="0" x2="960" y2="0" stroke="#30363d" stroke-width="1" />
    <rect width="960" height="50" fill="#161b22" />
    <path d="M0 38 L0 50 L960 50 L960 38 Z" fill="#161b22" />

    <!-- Buttons -->
    <rect x="730" y="10" width="90" height="30" rx="6" fill="#21262d" stroke="#30363d" stroke-width="1" />
    <text x="775" y="29" font-family="'Space Grotesk', sans-serif" font-size="12" fill="#e6edf3" text-anchor="middle">Cancel</text>

    <rect x="835" y="10" width="105" height="30" rx="6" fill="#58a6ff" />
    <text x="887" y="29" font-family="'Space Grotesk', sans-serif" font-size="12" font-weight="700" fill="#0d1117" text-anchor="middle">Apply &amp; OK</text>
  </g>
</svg>
