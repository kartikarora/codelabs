<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 650" width="100%" height="100%">
  <!-- Phone Frame -->
  <rect width="400" height="650" rx="32" fill="#0d1117" stroke="#30363d" stroke-width="3" />
  
  <!-- Status Bar -->
  <text x="32" y="32" font-family="'JetBrains Mono', monospace" font-size="12" fill="#8b949e">9:41</text>
  <circle cx="350" cy="28" r="4" fill="#8b949e" />
  <circle cx="362" cy="28" r="4" fill="#8b949e" />

  <!-- Top App Bar -->
  <text x="32" y="80" font-family="'Space Grotesk', sans-serif" font-size="20" font-weight="700" fill="#e6edf3">Where to Watch</text>
  <line x1="32" y1="96" x2="368" y2="96" stroke="#30363d" stroke-width="1" />

  <!-- Movie Header Area (Poster & Title) -->
  <g transform="translate(32, 115)">
    <rect width="90" height="130" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1.5" />
    <rect x="20" y="25" width="50" height="80" rx="4" fill="#21262d" />
    <text x="45" y="70" font-family="'Space Grotesk', sans-serif" font-size="12" font-weight="600" fill="#8b949e" text-anchor="middle">POSTER</text>
    
    <text x="105" y="30" font-family="'Space Grotesk', sans-serif" font-size="18" font-weight="700" fill="#e6edf3">Inception (2010)</text>
    <text x="105" y="55" font-family="'Space Grotesk', sans-serif" font-size="12" fill="#8b949e">Sci-Fi • 2h 28m • 8.8/10</text>
    
    <g transform="translate(105, 75)">
      <rect width="50" height="24" rx="6" fill="#161b22" stroke="#30363d" stroke-width="1" />
      <text x="25" y="16" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="600" fill="#58a6ff" text-anchor="middle">4K UHD</text>
    </g>
    <g transform="translate(165, 75)">
      <rect width="60" height="24" rx="6" fill="#161b22" stroke="#30363d" stroke-width="1" />
      <text x="30" y="16" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="600" fill="#d2a8ff" text-anchor="middle">Dolby 5.1</text>
    </g>
  </g>

  <!-- Streaming Availability Section -->
  <g transform="translate(32, 275)">
    <text x="0" y="18" font-family="'Space Grotesk', sans-serif" font-size="14" font-weight="700" fill="#8b949e">STREAMING SUBSCRIPTIONS</text>
    
    <!-- Provider Card 1 -->
    <g transform="translate(0, 30)">
      <rect width="336" height="55" rx="12" fill="#161b22" stroke="#30363d" stroke-width="1" />
      <circle cx="30" cy="27" r="16" fill="#e50914" />
      <text x="30" y="33" font-family="'Space Grotesk', sans-serif" font-size="12" font-weight="700" fill="#fff" text-anchor="middle">N</text>
      <text x="60" y="32" font-family="'Space Grotesk', sans-serif" font-size="15" font-weight="600" fill="#e6edf3">Netflix</text>
      <text x="280" y="32" font-family="'JetBrains Mono', monospace" font-size="12" fill="#58a6ff">Included</text>
    </g>

    <!-- Provider Card 2 -->
    <g transform="translate(0, 95)">
      <rect width="336" height="55" rx="12" fill="#161b22" stroke="#30363d" stroke-width="1" />
      <circle cx="30" cy="27" r="16" fill="#113ccf" />
      <text x="30" y="33" font-family="'Space Grotesk', sans-serif" font-size="12" font-weight="700" fill="#fff" text-anchor="middle">D+</text>
      <text x="60" y="32" font-family="'Space Grotesk', sans-serif" font-size="15" font-weight="600" fill="#e6edf3">Disney+</text>
      <text x="280" y="32" font-family="'JetBrains Mono', monospace" font-size="12" fill="#58a6ff">Included</text>
    </g>

    <!-- Rent / Buy Card -->
    <g transform="translate(0, 160)">
      <rect width="336" height="55" rx="12" fill="#161b22" stroke="#30363d" stroke-width="1" />
      <circle cx="30" cy="27" r="16" fill="#21262d" />
      <text x="30" y="33" font-family="'Space Grotesk', sans-serif" font-size="12" font-weight="700" fill="#fff" text-anchor="middle">A</text>
      <text x="60" y="32" font-family="'Space Grotesk', sans-serif" font-size="15" font-weight="600" fill="#e6edf3">Apple TV</text>
      <text x="270" y="32" font-family="'JetBrains Mono', monospace" font-size="12" fill="#d2a8ff">Rent $4.99</text>
    </g>
  </g>

  <!-- CTA Button -->
  <g transform="translate(32, 560)">
    <rect width="336" height="50" rx="12" fill="#58a6ff" />
    <text x="168" y="31" font-family="'Space Grotesk', sans-serif" font-size="15" font-weight="700" text-anchor="middle" fill="#0d1117">Add to Watchlist &amp; Alerts</text>
  </g>
</svg>
