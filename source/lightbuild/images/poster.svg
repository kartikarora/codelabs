<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0e14" />
      <stop offset="50%" stop-color="#0d1117" />
      <stop offset="100%" stop-color="#161b22" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0.0" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bgGrad)" />

  <!-- Subtle grid lines -->
  <g stroke="#21262d" stroke-width="1" opacity="0.6">
    <line x1="0" y1="126" x2="1200" y2="126" />
    <line x1="0" y1="252" x2="1200" y2="252" />
    <line x1="0" y1="378" x2="1200" y2="378" />
    <line x1="0" y1="504" x2="1200" y2="504" />
    <line x1="200" y1="0" x2="200" y2="630" />
    <line x1="400" y1="0" x2="400" y2="630" />
    <line x1="600" y1="0" x2="600" y2="630" />
    <line x1="800" y1="0" x2="800" y2="630" />
    <line x1="1000" y1="0" x2="1000" y2="630" />
  </g>

  <!-- Glow circle -->
  <circle cx="950" cy="280" r="220" fill="url(#glowGrad)" filter="blur(40px)" />

  <!-- Left Content Area -->
  <g transform="translate(80, 100)">
    <!-- Pill Badge -->
    <rect width="320" height="34" rx="17" fill="#161b22" stroke="#30363d" stroke-width="1" />
    <circle cx="18" cy="17" r="5" fill="#38bdf8" />
    <text x="32" y="22" font-family="'Space Grotesk', -apple-system, sans-serif" font-size="12" font-weight="600" fill="#38bdf8" letter-spacing="1.5">ANDROID DEV SUMMIT 2026</text>

    <!-- Heading -->
    <text x="0" y="95" font-family="'Space Grotesk', -apple-system, sans-serif" font-size="44" font-weight="700" fill="#f0f6fc" letter-spacing="-0.5">Declarative, Agent-Ready</text>
    <text x="0" y="150" font-family="'Space Grotesk', -apple-system, sans-serif" font-size="44" font-weight="700" fill="url(#accentGrad)" letter-spacing="-0.5">Builds with Lightbuild</text>

    <!-- Subtitle -->
    <text x="0" y="205" font-family="'Albert Sans', sans-serif" font-size="19" font-weight="400" fill="#8b949e">
      From imperative Gradle scripts to deterministic YAML &amp; resolved lockfiles.
    </text>

    <!-- Highlights Badges -->
    <g transform="translate(0, 245)">
      <rect width="180" height="36" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <text x="20" y="23" font-family="'JetBrains Mono', monospace" font-size="13" font-weight="500" fill="#38bdf8">project.lightbuild.yaml</text>

      <rect x="195" width="130" height="36" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <text x="215" y="23" font-family="'JetBrains Mono', monospace" font-size="13" font-weight="500" fill="#a78bfa">resolved.deps</text>

      <rect x="340" width="145" height="36" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <text x="360" y="23" font-family="'JetBrains Mono', monospace" font-size="13" font-weight="500" fill="#34d399">lightbuild CLI</text>
    </g>

    <!-- Author block -->
    <g transform="translate(0, 360)">
      <text x="0" y="0" font-family="'Space Grotesk', sans-serif" font-size="18" font-weight="600" fill="#e6edf3">Kartik Arora</text>
      <text x="0" y="22" font-family="'Albert Sans', sans-serif" font-size="14" fill="#8b949e">Lead Engineer @ Bilue · GDE Android · kartikarora.me</text>
    </g>
  </g>

  <!-- Right Graphic Mockup -->
  <g transform="translate(720, 95)">
    <!-- Terminal / Editor Card -->
    <rect width="420" height="420" rx="12" fill="#0d1117" stroke="#30363d" stroke-width="1.5" filter="drop-shadow(0 20px 30px rgba(0,0,0,0.5))" />
    
    <!-- Top bar -->
    <rect width="420" height="38" rx="12" fill="#161b22" />
    <circle cx="20" cy="19" r="5" fill="#f87171" />
    <circle cx="36" cy="19" r="5" fill="#fbbf24" />
    <circle cx="52" cy="19" r="5" fill="#34d399" />
    <text x="80" y="23" font-family="'JetBrains Mono', monospace" font-size="12" fill="#8b949e">app — lightbuild.yaml</text>

    <!-- Code Content -->
    <g transform="translate(24, 62)" font-family="'JetBrains Mono', monospace" font-size="12">
      <text y="0" fill="#ff7b72">type: </text><text x="45" y="0" fill="#a5d6ff">application</text>
      <text y="20" fill="#ff7b72">platform: </text><text x="75" y="20" fill="#a5d6ff">android</text>
      
      <text y="48" fill="#ff7b72">android:</text>
      <text y="68" fill="#79c0ff">  namespace: </text><text x="100" y="68" fill="#a5d6ff">me.kartikarora.icanhazstream</text>
      <text y="88" fill="#79c0ff">  applicationId: </text><text x="125" y="88" fill="#a5d6ff">me.kartikarora.icanhazstream</text>
      <text y="108" fill="#79c0ff">  compileSdk:</text>
      <text y="128" fill="#79c0ff">    version:</text>
      <text y="148" fill="#79c0ff">      release:</text>
      <text y="168" fill="#79c0ff">        apiLevel: </text><text x="110" y="168" fill="#7ee787">36</text>
      <text y="192" fill="#79c0ff">  minSdk:</text>
      <text y="212" fill="#79c0ff">    version:</text>
      <text y="232" fill="#79c0ff">      release:</text>
      <text y="252" fill="#79c0ff">        apiLevel: </text><text x="110" y="252" fill="#7ee787">24</text>
      <text y="276" fill="#79c0ff">  dependencies:</text>
      <text y="296" fill="#d2a8ff">    module:</text>
      <text y="316" fill="#d2a8ff">      - </text><text x="25" y="316" fill="#a5d6ff">//app-core</text>

      <text y="344" fill="#34d399">$ lightbuild build app:app-debug.apk ✓</text>
    </g>
  </g>
</svg>
