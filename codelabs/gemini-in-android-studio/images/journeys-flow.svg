<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 350" width="100%" height="100%">
  <rect width="900" height="350" rx="16" fill="#0f172a" stroke="#334155" stroke-width="1.5" />

  <!-- Left: Plain English Test Prompt -->
  <g transform="translate(40, 50)">
    <rect width="360" height="250" rx="12" fill="#1e293b" stroke="#38bdf8" stroke-width="2" />
    <rect width="360" height="40" rx="12" fill="#0284c7" />
    <text x="20" y="26" font-family="'Space Grotesk', sans-serif" font-size="14" font-weight="700" fill="#f8fafc">find_streaming_provider.journey</text>
    
    <text x="20" y="75" font-family="'JetBrains Mono', monospace" font-size="12" fill="#c084fc">name: <tspan fill="#f8fafc">Find Streaming Provider</tspan></text>
    <text x="20" y="105" font-family="'JetBrains Mono', monospace" font-size="12" fill="#38bdf8">steps:</text>
    <text x="35" y="130" font-family="'JetBrains Mono', monospace" font-size="11" fill="#cbd5e1">- Launch "ICanHazStream"</text>
    <text x="35" y="155" font-family="'JetBrains Mono', monospace" font-size="11" fill="#cbd5e1">- Search for "Inception"</text>
    <text x="35" y="180" font-family="'JetBrains Mono', monospace" font-size="11" fill="#cbd5e1">- Tap first movie result</text>
    <text x="35" y="205" font-family="'JetBrains Mono', monospace" font-size="11" fill="#cbd5e1">- Select regional filter "AU"</text>
    <text x="35" y="230" font-family="'JetBrains Mono', monospace" font-size="11" fill="#4ade80">- Assert "Netflix" in 4K stream</text>
  </g>

  <!-- Middle: Multimodal Vision AI -->
  <g transform="translate(420, 140)">
    <circle cx="30" cy="30" r="30" fill="#1e1b4b" stroke="#818cf8" stroke-width="2" />
    <text x="30" y="36" font-family="'Space Grotesk', sans-serif" font-size="12" font-weight="700" text-anchor="middle" fill="#818cf8">Vision</text>
    <text x="30" y="80" font-family="'Space Grotesk', sans-serif" font-size="11" font-weight="700" text-anchor="middle" fill="#818cf8">Vision AI</text>
  </g>

  <!-- Right: Running Android Emulator Phone -->
  <g transform="translate(520, 50)">
    <rect width="340" height="250" rx="16" fill="#1e1b4b" stroke="#10b981" stroke-width="2" />
    <rect width="340" height="40" rx="16" fill="#065f46" />
    <text x="20" y="26" font-family="'Space Grotesk', sans-serif" font-size="14" font-weight="700" fill="#a7f3d0">Android Emulator (Pixel 9 Pro)</text>

    <!-- Simulated UI Step Highlights -->
    <g transform="translate(20, 60)">
      <rect width="300" height="40" rx="8" fill="#1e293b" stroke="#4ade80" stroke-width="1.5" stroke-dasharray="4,4" />
      <text x="15" y="25" font-family="'Space Grotesk', sans-serif" font-size="13" fill="#f8fafc">Action: Tap "Inception (2010)"</text>
    </g>
    <g transform="translate(20, 115)">
      <rect width="300" height="40" rx="8" fill="#1e293b" />
      <text x="15" y="25" font-family="'Space Grotesk', sans-serif" font-size="13" fill="#f8fafc">Action: Filter Region "AU"</text>
    </g>
    <g transform="translate(20, 170)">
      <rect width="300" height="50" rx="8" fill="#022c22" stroke="#10b981" stroke-width="1.5" />
      <text x="15" y="30" font-family="'Space Grotesk', sans-serif" font-size="14" font-weight="700" fill="#4ade80">ASSERTION PASSED (Netflix 4K)</text>
    </g>
  </g>
</svg>
