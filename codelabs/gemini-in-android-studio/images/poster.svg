<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <!-- Background -->
  <rect width="1200" height="630" fill="#0d1117" />

  <!-- Subtle grid -->
  <g stroke="#21262d" stroke-width="1">
    <line x1="0" y1="126" x2="1200" y2="126" />
    <line x1="0" y1="252" x2="1200" y2="252" />
    <line x1="0" y1="378" x2="1200" y2="378" />
    <line x1="0" y1="504" x2="1200" y2="504" />
    <line x1="240" y1="0" x2="240" y2="630" />
    <line x1="480" y1="0" x2="480" y2="630" />
    <line x1="720" y1="0" x2="720" y2="630" />
    <line x1="960" y1="0" x2="960" y2="630" />
  </g>

  <!-- Left Content Area -->
  <g transform="translate(80, 110)">
    <!-- Pill Badge -->
    <rect width="280" height="34" rx="17" fill="#161b22" stroke="#30363d" stroke-width="1" />
    <circle cx="18" cy="17" r="5" fill="#58a6ff" />
    <text x="32" y="22" font-family="'Space Grotesk', -apple-system, sans-serif" font-size="12" font-weight="600" fill="#8b949e" letter-spacing="1">ANDROID STUDIO WORKSHOP</text>

    <!-- Heading -->
    <text x="0" y="95" font-family="'Space Grotesk', -apple-system, sans-serif" font-size="46" font-weight="700" fill="#e6edf3" letter-spacing="-0.5">Gemini in</text>
    <text x="0" y="150" font-family="'Space Grotesk', -apple-system, sans-serif" font-size="46" font-weight="700" fill="#58a6ff" letter-spacing="-0.5">Android Studio</text>

    <!-- Subtitle / Theme -->
    <text x="0" y="210" font-family="'Space Grotesk', -apple-system, sans-serif" font-size="18" font-weight="400" fill="#8b949e">
      Building ICanHazStream with AI-assisted Android workflows
    </text>

    <!-- Tags -->
    <g transform="translate(0, 260)">
      <!-- Tag 1 -->
      <rect width="115" height="32" rx="6" fill="#161b22" stroke="#30363d" stroke-width="1" />
      <text x="14" y="21" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="500" fill="#e6edf3">Agent Mode</text>

      <!-- Tag 2 -->
      <rect x="127" width="135" height="32" rx="6" fill="#161b22" stroke="#30363d" stroke-width="1" />
      <text x="141" y="21" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="500" fill="#e6edf3">GitHub MCP</text>

      <!-- Tag 3 -->
      <rect x="274" width="145" height="32" rx="6" fill="#161b22" stroke="#30363d" stroke-width="1" />
      <text x="288" y="21" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="500" fill="#e6edf3">Studio Journeys</text>

      <!-- Tag 4 -->
      <rect x="431" width="125" height="32" rx="6" fill="#161b22" stroke="#30363d" stroke-width="1" />
      <text x="445" y="21" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="500" fill="#e6edf3">Android CLI</text>
    </g>
  </g>

  <!-- Right IDE Window Illustration -->
  <g transform="translate(680, 100)">
    <!-- Main Window Frame -->
    <rect width="450" height="420" rx="12" fill="#161b22" stroke="#30363d" stroke-width="1.5" />
    
    <!-- Titlebar -->
    <rect width="450" height="36" rx="12" fill="#21262d" />
    <path d="M0 24 L0 36 L450 36 L450 24 Z" fill="#21262d" />
    <circle cx="20" cy="18" r="5" fill="#f85149" />
    <circle cx="36" cy="18" r="5" fill="#d29922" />
    <circle cx="52" cy="18" r="5" fill="#2ea043" />
    <text x="225" y="22" font-family="'JetBrains Mono', monospace" font-size="11" fill="#8b949e" text-anchor="middle">ICanHazStream — Android Studio</text>

    <!-- Tab Bar -->
    <g transform="translate(0, 36)">
      <rect width="450" height="30" fill="#0d1117" />
      <!-- Active Tab -->
      <rect width="180" height="30" fill="#161b22" stroke="#30363d" stroke-width="0.5" />
      <text x="18" y="20" font-family="'JetBrains Mono', monospace" font-size="11" fill="#58a6ff">WhereToWatchScreen.kt</text>
      <!-- Inactive Tab -->
      <text x="200" y="20" font-family="'JetBrains Mono', monospace" font-size="11" fill="#8b949e">TrendingViewModel.kt</text>
      <line x1="0" y1="30" x2="450" y2="30" stroke="#30363d" stroke-width="1" />
    </g>

    <!-- Code Editor Body -->
    <g transform="translate(20, 90)">
      <!-- Line Numbers -->
      <text x="0" y="20" font-family="'JetBrains Mono', monospace" font-size="11" fill="#484f58">1</text>
      <text x="0" y="42" font-family="'JetBrains Mono', monospace" font-size="11" fill="#484f58">2</text>
      <text x="0" y="64" font-family="'JetBrains Mono', monospace" font-size="11" fill="#484f58">3</text>
      <text x="0" y="86" font-family="'JetBrains Mono', monospace" font-size="11" fill="#484f58">4</text>
      <text x="0" y="108" font-family="'JetBrains Mono', monospace" font-size="11" fill="#484f58">5</text>
      <text x="0" y="130" font-family="'JetBrains Mono', monospace" font-size="11" fill="#484f58">6</text>
      <text x="0" y="152" font-family="'JetBrains Mono', monospace" font-size="11" fill="#484f58">7</text>

      <!-- Code Text -->
      <text x="24" y="20" font-family="'JetBrains Mono', monospace" font-size="11" fill="#d2a8ff">@Composable</text>
      <text x="24" y="42" font-family="'JetBrains Mono', monospace" font-size="11" fill="#79c0ff">fun <tspan fill="#e6edf3">WhereToWatchScreen</tspan>(</text>
      <text x="44" y="64" font-family="'JetBrains Mono', monospace" font-size="11" fill="#8b949e">movieId: String,</text>
      <text x="44" y="86" font-family="'JetBrains Mono', monospace" font-size="11" fill="#8b949e">viewModel: DetailViewModel</text>
      <text x="24" y="108" font-family="'JetBrains Mono', monospace" font-size="11" fill="#e6edf3">) {</text>
      <text x="44" y="130" font-family="'JetBrains Mono', monospace" font-size="11" fill="#79c0ff">  val <tspan fill="#e6edf3">state</tspan> <tspan fill="#8b949e">by viewModel.uiState.collectAsState()</tspan></text>
      <text x="44" y="152" font-family="'JetBrains Mono', monospace" font-size="11" fill="#79c0ff">  MovieProviderList<tspan fill="#8b949e">(state.providers)</tspan></text>
      <text x="24" y="174" font-family="'JetBrains Mono', monospace" font-size="11" fill="#e6edf3">}</text>
    </g>

    <!-- Mini Embedded Card / Component Preview -->
    <g transform="translate(20, 290)">
      <rect width="410" height="90" rx="8" fill="#0d1117" stroke="#30363d" stroke-width="1" />
      <!-- Film Poster Thumbnail -->
      <rect x="14" y="14" width="44" height="62" rx="4" fill="#21262d" stroke="#30363d" stroke-width="1" />
      <rect x="22" y="24" width="28" height="42" rx="2" fill="#30363d" />
      
      <!-- Movie Meta -->
      <text x="70" y="34" font-family="'Space Grotesk', sans-serif" font-size="14" font-weight="600" fill="#e6edf3">Inception (2010)</text>
      <text x="70" y="52" font-family="'Space Grotesk', sans-serif" font-size="11" fill="#8b949e">Streaming on Netflix • 4K UHD</text>
      
      <!-- Badge -->
      <rect x="70" y="60" width="60" height="18" rx="4" fill="#161b22" stroke="#30363d" stroke-width="1" />
      <text x="100" y="73" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="600" fill="#58a6ff" text-anchor="middle">INCLUDED</text>

      <rect x="136" y="60" width="48" height="18" rx="4" fill="#161b22" stroke="#30363d" stroke-width="1" />
      <text x="160" y="73" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="600" fill="#d2a8ff" text-anchor="middle">4K HDR</text>
    </g>
  </g>
</svg>
