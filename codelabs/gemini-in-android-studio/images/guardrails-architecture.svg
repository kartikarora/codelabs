<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" width="100%" height="100%">
  <rect width="900" height="400" rx="16" fill="#0d1117" stroke="#30363d" stroke-width="1.5" />

  <!-- AGENTS.md Box -->
  <g transform="translate(60, 60)">
    <rect width="240" height="120" rx="12" fill="#161b22" stroke="#58a6ff" stroke-width="2" />
    <text x="20" y="38" font-family="'Space Grotesk', sans-serif" font-size="18" font-weight="700" fill="#58a6ff">AGENTS.md</text>
    <text x="20" y="65" font-family="'JetBrains Mono', monospace" font-size="12" fill="#8b949e">• Multi-module rules</text>
    <text x="20" y="85" font-family="'JetBrains Mono', monospace" font-size="12" fill="#8b949e">• MVVM &amp; StateFlow</text>
    <text x="20" y="105" font-family="'JetBrains Mono', monospace" font-size="12" fill="#8b949e">• Ktor &amp; Serialization</text>
  </g>

  <!-- Skill Box -->
  <g transform="translate(60, 220)">
    <rect width="240" height="120" rx="12" fill="#161b22" stroke="#d2a8ff" stroke-width="2" />
    <text x="20" y="38" font-family="'Space Grotesk', sans-serif" font-size="18" font-weight="700" fill="#d2a8ff">Compose Theme Skill</text>
    <text x="20" y="65" font-family="'JetBrains Mono', monospace" font-size="12" fill="#8b949e">• Space Grotesk fonts</text>
    <text x="20" y="85" font-family="'JetBrains Mono', monospace" font-size="12" fill="#8b949e">• Material 3 tokens</text>
    <text x="20" y="105" font-family="'JetBrains Mono', monospace" font-size="12" fill="#8b949e">• :core:ui components</text>
  </g>

  <!-- Central Gemini Agent Core -->
  <g transform="translate(380, 130)">
    <rect width="200" height="140" rx="16" fill="#161b22" stroke="#58a6ff" stroke-width="2" />
    <circle cx="100" cy="50" r="24" fill="#21262d" />
    <text x="100" y="56" font-family="'JetBrains Mono', monospace" font-size="14" font-weight="700" text-anchor="middle" fill="#58a6ff">AI</text>
    <text x="100" y="95" font-family="'Space Grotesk', sans-serif" font-size="16" font-weight="700" text-anchor="middle" fill="#e6edf3">Gemini Agent</text>
    <text x="100" y="118" font-family="'JetBrains Mono', monospace" font-size="11" text-anchor="middle" fill="#8b949e">Context Indexer</text>
  </g>

  <!-- .aiexclude Privacy Wall -->
  <g transform="translate(660, 130)">
    <rect width="180" height="140" rx="12" fill="#211215" stroke="#f85149" stroke-width="2" stroke-dasharray="6,6" />
    <text x="20" y="38" font-family="'Space Grotesk', sans-serif" font-size="18" font-weight="700" fill="#f85149">.aiexclude</text>
    <text x="20" y="65" font-family="'JetBrains Mono', monospace" font-size="12" fill="#ff7b72">• *.keystore</text>
    <text x="20" y="85" font-family="'JetBrains Mono', monospace" font-size="12" fill="#ff7b72">• secrets.json</text>
    <text x="20" y="105" font-family="'JetBrains Mono', monospace" font-size="12" fill="#ff7b72">• local.properties</text>
    <text x="90" y="130" font-family="'Space Grotesk', sans-serif" font-size="11" font-weight="700" text-anchor="middle" fill="#f85149">BLOCKED</text>
  </g>

  <!-- Connectors -->
  <!-- AGENTS.md -> Gemini -->
  <path d="M300 120 L380 170" fill="none" stroke="#58a6ff" stroke-width="2" />
  <!-- Skill -> Gemini -->
  <path d="M300 280 L380 230" fill="none" stroke="#d2a8ff" stroke-width="2" />
  <!-- Gemini -X-> .aiexclude -->
  <path d="M580 200 L660 200" fill="none" stroke="#f85149" stroke-width="2" stroke-dasharray="4,4" />
</svg>
