<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 350" width="100%" height="100%">
  <rect width="900" height="350" rx="16" fill="#0f172a" stroke="#334155" stroke-width="1.5" />

  <!-- Left: Terminal AI Agent -->
  <g transform="translate(50, 50)">
    <rect width="320" height="250" rx="14" fill="#1e293b" stroke="#10b981" stroke-width="2" />
    <rect width="320" height="38" rx="14" fill="#065f46" />
    <text x="20" y="24" font-family="'Space Grotesk', sans-serif" font-size="14" font-weight="700" fill="#a7f3d0">Terminal AI Agent</text>
    
    <text x="20" y="75" font-family="'JetBrains Mono', monospace" font-size="12" fill="#38bdf8">$ android project inspect</text>
    <text x="20" y="110" font-family="'JetBrains Mono', monospace" font-size="12" fill="#38bdf8">$ android symbol find "Movie"</text>
    <text x="20" y="145" font-family="'JetBrains Mono', monospace" font-size="12" fill="#38bdf8">$ android preview render</text>
    <text x="20" y="180" font-family="'JetBrains Mono', monospace" font-size="12" fill="#38bdf8">$ android build --fix-lint</text>

    <g transform="translate(20, 205)">
      <rect width="280" height="30" rx="6" fill="#022c22" />
      <text x="140" y="20" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="600" text-anchor="middle" fill="#4ade80">Headless Studio Bridge</text>
    </g>
  </g>

  <!-- Middle Bridge -->
  <g transform="translate(390, 140)">
    <rect width="120" height="60" rx="10" fill="#1e1b4b" stroke="#818cf8" stroke-width="2" />
    <text x="60" y="28" font-family="'Space Grotesk', sans-serif" font-size="12" font-weight="700" text-anchor="middle" fill="#f8fafc">Android CLI</text>
    <text x="60" y="48" font-family="'JetBrains Mono', monospace" font-size="10" text-anchor="middle" fill="#818cf8">IPC Daemon</text>
  </g>

  <!-- Right: Android Studio Daemon -->
  <g transform="translate(530, 50)">
    <rect width="320" height="250" rx="14" fill="#1e293b" stroke="#38bdf8" stroke-width="2" />
    <rect width="320" height="38" rx="14" fill="#0284c7" />
    <text x="20" y="24" font-family="'Space Grotesk', sans-serif" font-size="14" font-weight="700" fill="#f8fafc">Android Studio Core Engine</text>

    <g transform="translate(20, 60)">
      <rect width="280" height="48" rx="8" fill="#0f172a" stroke="#475569" stroke-width="1" />
      <text x="15" y="22" font-family="'JetBrains Mono', monospace" font-size="11" fill="#38bdf8">K2 Kotlin Compiler Daemon</text>
      <text x="15" y="38" font-family="'JetBrains Mono', monospace" font-size="9" fill="#94a3b8">Resolves multi-module symbols</text>
    </g>
    <g transform="translate(20, 120)">
      <rect width="280" height="48" rx="8" fill="#0f172a" stroke="#475569" stroke-width="1" />
      <text x="15" y="22" font-family="'JetBrains Mono', monospace" font-size="11" fill="#c084fc">Compose Layoutlib Renderer</text>
      <text x="15" y="38" font-family="'JetBrains Mono', monospace" font-size="9" fill="#94a3b8">Renders @Previews headlessly</text>
    </g>
    <g transform="translate(20, 180)">
      <rect width="280" height="48" rx="8" fill="#0f172a" stroke="#475569" stroke-width="1" />
      <text x="15" y="22" font-family="'JetBrains Mono', monospace" font-size="11" fill="#ec4899">Gradle 9.8 Daemon</text>
      <text x="15" y="38" font-family="'JetBrains Mono', monospace" font-size="9" fill="#94a3b8">Executes convention plugins</text>
    </g>
  </g>
</svg>
