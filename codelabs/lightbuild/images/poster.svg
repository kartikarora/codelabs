<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0e14" />
      <stop offset="100%" stop-color="#131820" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bgGrad)" />

  <!-- Centered Title & Subtitle -->
  <g transform="translate(600, 275)" text-anchor="middle">
    <text x="0" y="0" font-family="'Albert Sans', -apple-system, BlinkMacSystemFont, sans-serif" font-size="56" font-weight="700" fill="#f0f6fc" letter-spacing="-0.5">Declarative, Agent-Ready</text>
    <text x="0" y="68" font-family="'Albert Sans', -apple-system, BlinkMacSystemFont, sans-serif" font-size="56" font-weight="700" fill="url(#accentGrad)" letter-spacing="-0.5">Builds with Lightbuild</text>
    <text x="0" y="130" font-family="'Albert Sans', -apple-system, BlinkMacSystemFont, sans-serif" font-size="22" font-weight="400" fill="#8b949e">From imperative Gradle scripts to deterministic YAML.</text>
  </g>
</svg>
